import groovy.json.JsonSlurper

def config = new JsonSlurper().parse(rootProject.file('targets.json'))[project.name]
def repositoryRoot = rootProject.projectDir.parentFile
def releaseProperties = new Properties()
repositoryRoot.toPath().resolve('gradle.properties').toFile().withInputStream { releaseProperties.load(it) }
version = releaseProperties.getProperty('mod_version')
group = releaseProperties.getProperty('maven_group')
base { archivesName = "guogaology-dimension-${config.minecraft}" }
repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        guogaology {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${config.minecraft}"
    if (config.remap) {
        mappings loom.officialMojangMappings()
        modImplementation 'net.fabricmc:fabric-loader:0.19.5'
        modImplementation "net.fabricmc.fabric-api:fabric-api:${config.fabric}"
    } else {
        implementation 'net.fabricmc:fabric-loader:0.19.5'
        implementation "net.fabricmc.fabric-api:fabric-api:${config.fabric}"
    }
}

// Geometry and notation algorithms have one source for every supported game version.
def sharedNames = rootProject.file('shared-sources.txt').readLines().findAll { !it.isBlank() }
def generatedSources = layout.buildDirectory.dir('generated/sources')
tasks.register('preparePortSources', Exec) {
    inputs.dir(rootProject.file('common'))
    inputs.file(rootProject.file('shared-sources.txt'))
    inputs.file(repositoryRoot.toPath().resolve('tools/prepare_port_sources.py'))
    if (file('src').exists()) inputs.dir(file('src'))
    outputs.dir(generatedSources)
    commandLine providers.gradleProperty('portPython').getOrElse('python'),
        '-X', 'utf8', repositoryRoot.toPath().resolve('tools/prepare_port_sources.py'), config.minecraft
}
sourceSets.main.java.srcDirs = [generatedSources.map { it.dir('main') }]
sourceSets.main.java.srcDir(repositoryRoot.toPath().resolve('src/main/java').toFile())
sourceSets.main.java.exclude { element ->
    def file = element.file
    def original = repositoryRoot.toPath().resolve('src/main/java')
    !element.isDirectory() && file.toPath().startsWith(original) && !sharedNames.contains(original.relativize(file.toPath()).toString().replace('\\','/'))
}
sourceSets.client.java.srcDirs = [generatedSources.map { it.dir('client') }]
def generatedResources = layout.buildDirectory.dir('generated/resources')
sourceSets.main.resources.srcDirs = [generatedResources]
tasks.register('preparePortResources', Exec) {
    inputs.dir(repositoryRoot.toPath().resolve('src/main/resources'))
    inputs.dir(repositoryRoot.toPath().resolve('src/client/resources'))
    inputs.file(repositoryRoot.toPath().resolve('tools/prepare_port_resources.py'))
    inputs.file(repositoryRoot.toPath().resolve('tools/prepare_outer_resources.py'))
    inputs.file(repositoryRoot.toPath().resolve('tools/import_outer_content.py'))
    inputs.file(repositoryRoot.toPath().resolve('tools/outer_content_ids.json'))
    inputs.file(repositoryRoot.toPath().resolve('tools/outer_generated_resources.json'))
    if (config.minecraft == '26.3') {
        inputs.file(repositoryRoot.toPath().resolve('tools/prepare_263_motion_tags.py'))
        inputs.file(repositoryRoot.toPath().resolve('tools/reference/block-motion263.json'))
    }
    inputs.dir(repositoryRoot.toPath().resolve('content/outer-1.0.0'))
    inputs.file(rootProject.file('targets.json'))
    inputs.property('release', project.version)
    outputs.dir(generatedResources)
    commandLine providers.gradleProperty('portPython').getOrElse('python'),
        '-X', 'utf8', repositoryRoot.toPath().resolve('tools/prepare_port_resources.py'), config.minecraft, project.version
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('preparePortSources')
    options.release = config.java as int
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '500']
}
java { withSourcesJar() }
tasks.withType(Jar).configureEach { includeEmptyDirs = false }
tasks.named('sourcesJar') { dependsOn tasks.named('preparePortResources'), tasks.named('preparePortSources') }
processResources {
    dependsOn tasks.named('preparePortResources')
    inputs.property 'version', project.version
    inputs.property 'preserveJsonEscapes', true
    inputs.property 'minecraft', config.minecraft
    filesMatching('fabric.mod.json') { expand([version: project.version]) { escapeBackslash = true } }
}
jar { from(repositoryRoot.toPath().resolve('LICENSE').toFile()) }
def licenseNotices = ['LICENSE-MINECRAFT-EXCEPTION', 'COPYRIGHT', 'THIRD_PARTY.md'].collect { new File(repositoryRoot, it) }
jar { from(licenseNotices) }
tasks.named('sourcesJar') { from(new File(repositoryRoot, 'LICENSE')); from(licenseNotices) }

// Keep caches, servers and client profiles separate for each target.
loom.runs.configureEach {
    runDir "build/run/${name}"
}

if (project.name == '26.2' && project.hasProperty('mergeQa')) {
    sourceSets {
        mergeQa {
            java.srcDir rootProject.file('qa26')
            resources.srcDir rootProject.file('qa26-resources')
            compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
            runtimeClasspath += output + compileClasspath + sourceSets.client.runtimeClasspath
        }
    }
    tasks.register('mergeQaJar',Jar) {
        dependsOn tasks.named('mergeQaClasses')
        from sourceSets.mergeQa.output
        archiveBaseName='guogaology-merge-qa'
        destinationDirectory=layout.buildDirectory.dir('qa')
    }
}

// This helper is a separate, opt-in JAR. It never contributes to release source sets.
if (project.name == '26.3' && project.hasProperty('releaseQa263')) {
    sourceSets {
        releaseQa263 {
            java.srcDir rootProject.file('qa263')
            resources.srcDir rootProject.file('qa263-resources')
            compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
            runtimeClasspath += output + compileClasspath + sourceSets.client.runtimeClasspath
        }
    }
    tasks.register('releaseQa263Jar', Jar) {
        dependsOn tasks.named('releaseQa263Classes')
        from sourceSets.releaseQa263.output
        archiveBaseName = 'guogaology-release-263-qa'
        destinationDirectory = layout.buildDirectory.dir('qa')
    }
    tasks.named('processReleaseQa263Resources') {
        inputs.property('release', project.version)
        filesMatching('fabric.mod.json') { expand(version: project.version) }
        from(repositoryRoot.toPath().resolve('tools/reference/block-motion263.json')) {
            into 'guogaology-qa263'
        }
    }
}

// Native tool/tag regression on a real dedicated server; no client dependencies.
if (project.name == '26.3' && project.hasProperty('miningQa263')) {
    sourceSets {
        miningQa263 {
            java.srcDir rootProject.file('qa263-mining')
            resources.srcDir rootProject.file('qa263-mining-resources')
            compileClasspath += sourceSets.main.compileClasspath
            runtimeClasspath += output + compileClasspath
        }
    }
    tasks.register('miningQa263Jar', Jar) {
        dependsOn tasks.named('miningQa263Classes')
        from sourceSets.miningQa263.output
        archiveBaseName = 'guogaology-mining-263-qa'
        destinationDirectory = layout.buildDirectory.dir('qa')
    }
}

// Separate real TCP recipe/tag replay. Never included in production source sets.
if (project.name == '26.3' && project.hasProperty('networkQa263')) {
    sourceSets {
        networkQa263 {
            java.srcDir rootProject.file('qa263-network')
            resources.srcDir rootProject.file('qa263-network-resources')
            compileClasspath += sourceSets.client.compileClasspath
            runtimeClasspath += output + compileClasspath
        }
    }
    tasks.register('networkQa263Jar', Jar) {
        dependsOn tasks.named('networkQa263Classes')
        from sourceSets.networkQa263.output
        archiveBaseName = 'guogaology-network-263-qa'
        destinationDirectory = layout.buildDirectory.dir('qa')
    }
}
