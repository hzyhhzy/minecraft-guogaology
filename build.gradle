plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        googology {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    if (project.hasProperty('qaSodium')) modLocalRuntime files(project.property('qaSodium'))
}

// Only the 1.21.1 bridge is a nested intermediary JAR. Modern builds compile the
// same outer module directly. The public download remains a single mod file.
def outerBridge = layout.projectDirectory.file("ports/outer-1.21.1/build/libs/guogaology-outer-legacy-${project.version}.jar")
tasks.register('buildLegacyOuter', Exec) {
    inputs.dir('ports/common/main/dev/googology/outer')
    inputs.dir('ports/common/client/dev/googology/outer')
    inputs.dir('ports/outer-1.21.1/src')
    inputs.file('tools/prepare_outer_legacy.py')
    inputs.files('ports/common/main/dev/googology/mixin/OuterNoiseSettingsMixin.java', 'ports/common/main/dev/googology/mixin/OuterSpawnPlacementInvoker.java')
    inputs.files('ports/outer-1.21.1/build.gradle','ports/settings.gradle','gradle.properties')
    outputs.file(outerBridge)
    def windows = System.getProperty('os.name').toLowerCase().contains('windows')
    def wrapper = providers.gradleProperty('outerGradle').getOrElse(file(windows ? 'ports/gradlew.bat' : 'ports/gradlew').absolutePath)
    def args = ['-p', file('ports').absolutePath, '-Ptarget=outer-1.21.1', "-PportPython=${providers.gradleProperty('portPython').getOrElse('python')}", '--no-daemon', '--console=plain', ':outer-1.21.1:build']
    if (gradle.startParameter.offline) args += '--offline'
    commandLine([wrapper] + args)
}
tasks.named('jar') {
    dependsOn tasks.named('buildLegacyOuter')
    from(outerBridge) { into 'META-INF/jars' }
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    inputs.property 'preserveJsonEscapes', true
    filesMatching('fabric.mod.json') { expand([version: project.version]) { escapeBackslash = true } }
    doLast {
        def configFile = new File(destinationDir, 'googology.mixins.json')
        def config = new groovy.json.JsonSlurper().parse(configFile, 'UTF-8')
        config.mixins.removeAll { it == 'OuterNoiseSettingsMixin' || it == 'OuterSpawnPlacementInvoker' }
        configFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)), 'UTF-8')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
// Deleted namespaces must not linger as empty archive directories after an
// incremental resource build.
tasks.withType(Jar).configureEach { includeEmptyDirs = false }

jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
jar { from('LICENSE-MINECRAFT-EXCEPTION', 'COPYRIGHT', 'THIRD_PARTY.md') }
tasks.named('sourcesJar') { from('LICENSE', 'LICENSE-MINECRAFT-EXCEPTION', 'COPYRIGHT', 'THIRD_PARTY.md') }

// Development launches use named methods and can mask a wrongly assigned refmap.
// Validate the remapped artifact that a normal launcher actually loads.
tasks.register('verifyReleaseMixins') {
    dependsOn tasks.named('remapJar')
    inputs.file(tasks.named('remapJar').flatMap { it.archiveFile })
    doLast {
        def artifact = tasks.named('remapJar').get().archiveFile.get().asFile
        new java.util.jar.JarFile(artifact).withCloseable { jarFile ->
            def readJson = { String path ->
                def entry = jarFile.getJarEntry(path)
                if (entry == null) throw new GradleException("Missing release resource: ${path}")
                jarFile.getInputStream(entry).withCloseable { stream -> new groovy.json.JsonSlurper().parse(stream, 'UTF-8') }
            }
            ['googology.mixins.json', 'googology.client.mixins.json'].each { configPath ->
                def config = readJson(configPath)
                if (!config.refmap) throw new GradleException("Missing refmap in ${configPath}")
                def refmap = readJson(config.refmap)
                ((config.mixins ?: []) + (config.client ?: [])).each { mixinName ->
                    def owner = (config.package + '.' + mixinName).replace('.', '/')
                    if (jarFile.getJarEntry(owner + '.class') == null || !refmap.mappings[owner]) {
                        throw new GradleException("${configPath} assigns ${owner} to the wrong refmap: ${config.refmap}")
                    }
                    logger.lifecycle("Verified release mixin: ${owner} -> ${config.refmap}")
                }
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyReleaseMixins') }
