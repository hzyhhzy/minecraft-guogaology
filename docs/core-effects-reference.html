 formulaCard(b('攻击：表界加算，里界按来源乘算','Attack: normal addition, deep source factors'),[b('表界幂塔Lv1/2/3单颗+1/2/3HP，序数晶体／晶核Lv1／2／3依次单颗+0.5/1/1.5/2.5HP。各来源内部RSS后相加。里界幂塔单颗25%/50%/100%，序数5%/10%/20%/40%。同源先RSS，再形成一个倍率。','Normal Power values are1/2/3HP;Ordinal values are0.5/1/1.5/2.5HP. Add separately aggregated source RSS values. Deep Power values are25%/50%/100%;Ordinal values are5%/10%/20%/40%. RSS within each source, then form one multiplier.')],['NormalAttack = Base + BookInnateAttackHP + RSS(SwordPowerHP) + RSS(BookPowerHP) + RSS(BookOrdinalHP)','DeepAttack = Base·(1+b)·(1+RSS(BookOrdinalPct))·(1+RSS(BookPowerPct))·(1+RSS(SwordPowerPct))']),
 formulaCard(b('防护与真实原版护甲','Protection and native armor'),[b(`甲界限单颗值25%/50%/100%，每件先RSS，再按份额${armorShares}加权求和，整体乘2形成C。书界限单颗值同样是25%/50%/100%；书序数防护5%/10%/20%/40%。`,`Armor Boundary values are25%/50%/100%. RSS within each item, weight by shares${armorShares}, sum and multiply by2 to form C. Book Boundary values also use25%/50%/100%;book Ordinal protection uses5%/10%/20%/40%.`),b('四套原版护甲/韧性为16/4、18/8、20/12、22/16，混搭按实际部位相加。裸甲不再有自定义F0。真正原版减伤按本击伤害、护甲与韧性计算，并非固定80%。晶核倍率随后独立应用，也保护声波与虚空。','Full-set native armor/toughness are16/4,18/8,20/12,22/16;mixing uses actual equipped-piece contributions. Bare armor has no custom F0. Native reduction uses this hit’s damage, armor and toughness, not a fixed80%. Core tolerance then applies separately, also to sonic boom and void.'),b('甲损耗按受击前配置并乘防护衰减；H×F只描述晶核防护前的生命预算，不包含原版甲，也不能自动视为实际原始伤害阈值。','Armor wear uses the pre-hit configuration and protection attenuation. H×F describes a health budget before core protection;it excludes native armor and is not automatically the raw incoming damage threshold.')],['C = 2·sum(ArmorSlotShare·RSS(ItemBoundaryPct))','NormalCoreTolerance = (1+C)·(1+b+RSS(BookBoundaryPct)+RSS(BookOrdinalPct))','DeepCoreTolerance = (1+C)·(1+b)·(1+RSS(BookBoundaryPct))·(1+RSS(BookOrdinalPct))','NativeArmor = floor(TotalArmorAttribute)','FinalDamage = SourceSpecificNativeDamage / CoreTolerance']),
 formulaCard(b('生命、治疗与状态延时','Health, healing and status duration'),[b('最大生命仅取生效书的果糕之心，两界一致；甲、序数与裸书不加生命。紫菜每80刻治疗，序数和书基值只放大已有治疗。饥饿保障10/19取最高且不补饱和度；自然回血仍是另一个机制。','Maximum health uses only Guogao in the active book and matches across realms. Armor, Ordinal and bare books grant no health. Laver heals every80 ticks;Ordinal and baseline only amplify existing healing. Food floors10/19 use the highest grade without saturation;native regeneration remains separate.'),b('果糕剑／弓的基础状态为2秒。书固有延时和序数延时相加后乘到这2秒；剑／弓没有果糕核心时不产生状态，书中只有果糕也不代替武器核心。','Guogao sword/bow base effects last2 seconds. Innate and Ordinal duration terms add, then multiply those2 seconds. No Guogao in the sword/bow means no on-hit effects;book Guogao alone does not substitute for the weapon core.')],['HP = 20 + 4·RSS(BookGuogaoGrades)','HealingPer4s = RSS(BookLaverGrades)·(1+BookHealingBase+RSS(BookOrdinalHealingValues))','GuogaoHitSeconds = 2·(1+BookDurationBase+RSS(BookOrdinalDurationValues))']),
 formulaCard(b('挖掘、触距与耐久','Mining, reach and wear'),[b('两界挖速同式：工具基础＋适用原版效率＋RSS书序列固定值，再乘1＋书固有挖速百分比＋RSS书序列百分比＋20%×急迫等级；书固有值不进RSS。最后乘原版疲劳、水下、未站稳及其他惩罚。空手/错误工具基础1；书两项仍生效。原版效率仅在工具原始基础>1时加e²+1，不能用书加值解锁。序数不参与挖速。','Both realms use: tool base + applicable native Efficiency + RSS book Sequence flat, multiplied by1 + innate book mining rate + RSS book Sequence rate +20%×Haste level. Innate stays outside RSS. Apply native fatigue, water, airborne and other penalties last. Hand/wrong tool base1 keeps both book bonuses. Native Efficiency adds e²+1 only when raw tool base>1; book flat cannot unlock it. Ordinal adds no mining speed.'),b('额外开采两界都RSS再取整，单颗预算普通1/2/3、里界1/4/9。分枝时运/抢夺取最高2×等级并加原版同类等级，精准模式替代时运。','Extra mining uses RSS then floor in both realms, with budgets1/2/3 normal and1/4/9 deep. Branch uses the highest2×grade plus native Fortune/Looting; Silk Touch replaces Fortune.'),b('分枝书触距=RSS等级；空集本件耐久预算4/16/64直接相加，用耗损概率实现。两界相同，裸书和序数都不参与。','Branch book reach=RSS grades. Absence item wear budgets4/16/64 add and act through consumption chance. Both match across realms;bare books and Ordinal do not contribute.')],['MiningSpeed = (ToolBase + NativeEfficiency + RSS(BookSequenceFlat))·(1 + BookInnateMiningRate + RSS(BookSequenceRate) + 0.2·HasteLevel)·Fatigue·OtherNativePenalties','NativeEfficiency = ToolBase>1 and e>0 ? e²+1 : 0','ExtraBlocks = floor(RSS(PickSequenceBudgets))','ReachExtra = RSS(BookBranchGrades)','WearFactor = max(1,sum(ItemAbsenceWearBudgets)); WearChance = 1/WearFactor']),
 formulaCard(b('爆裂与分级能力','Bursts and grade-based abilities'),[b('里界环境另使摔落、鞘翅撞墙伤害×0.5，安全摔落高度×2；与晶核/附魔相乘。地府不应用这条环境规则。','The Inner realm separately multiplies fall and elytra impact damage by0.5 and safe fall distance by2; it stacks with core/enchantment protection. This environmental rule does not apply in the Underworld.'),b('剑／弓临界系数15%/22.5%/30%，多颗RSS。临界核晶禁止装手稿；爆裂不再额外读取书基值或序数，剑爆裂不再次乘暴击或冷却。','Sword/bow Critical coefficients are15%/22.5%/30%, combined with RSS. Criticality cannot fit manuscripts. No extra book-baseline/Ordinal scaling; sword bursts do not apply crit/cooldown again.'),b('界限任意级每颗步行/跑步+50%，按RSS合计，飞行不变。Lv1跳跃按颗数相加，安全高度×2及伤害×0.5只应用一次，混装高阶仍保留；Lv2免摔，Lv3免摔和撞墙。飞行、隐蔽、水域能力、饥饿和免疫各自取最高；Lv3水平和升降冲刺均为表界2倍、里界/地府8倍；Lv2无冲刺，双轴基速为Lv3的表界1/6、里界/地府1/3。','Each Boundary grade contributes50% walking/sprinting speed via RSS; flight is unchanged. Lv1 jumps add per core, while safe distance×2 and impact damage×0.5 apply once and coexist with higher grades. Lv2 ignores falls; Lv3 also ignores walls. Flight, stealth, aquatic perks, food and immunity use their highest grades; Lv3 sprint multiplies both axes by2 outside and by8 in Inner/Underworld realms. Lv2 has no sprint boost and uses one sixth of Lv3 base speed outside, one third in Inner/Underworld realms.'),b('空集不清已有仇恨、不处理特殊索敌；能力由服务器按玩家当前生效手稿判定。','Absence does not clear existing aggro or handle special targeting. The server evaluates abilities from each player’s active manuscript.')],['BurstCoefficient = RSS(IndividualCoefficients)','SwordBurst = EnhancedAttack·SwordBurstCoefficient','ArrowBurst = EnhancedArrowHit·BowBurstCoefficient'])
 ];cards.push(formulaCard(b('四档序数弓','Four ordinal bows'),[b('沿用原版蓄力、箭基础伤害系数2、重力和阻力。ω／ε／Γ／Ω初速倍率1.1／1.2／1.3／1.5，满弦初速3.3／3.6／3.9／4.5格每刻；基础耐久768／1152／1536／2304。攻击强化另按幂塔与手稿规则加入。','Vanilla draw, base damage coefficient2, gravity and drag. ω/ε/Γ/Ω launch multipliers1.1/1.2/1.3/1.5, full-draw launch speeds3.3/3.6/3.9/4.5 blocks/tick; durability768/1152/1536/2304. Power and manuscript attack enhancements apply separately.'),b('原版直击先按碰撞速度取ceil(2v)，满弦再加原版随机值；表界晶核加伤乘蓄力速度比例，里界乘独立攻击因子。三箭不将同一目标伤害乘3。','Vanilla direct damage starts with ceil(2v) at impact and retains the full-draw random bonus. Normal core additions scale with draw-speed fraction; deep damage uses independent attack factors. Three arrows never multiply single-target damage by3.')],['VanillaArrowBase = ceil(2·ImpactSpeed)','NormalArrowHit = VanillaArrowHit + DrawFraction·CrystalAttackHP','DeepArrowHit = VanillaArrowHit·InnateFactor·BookOrdinalFactor·BookPowerFactor·BowPowerFactor']));$('formulas').replaceChildren(...cards);
 const head=document.createElement('tr');for(const key of ['tier','gearSlots','bookSlots','nativeArmor','nativeToughness'])head.append(cell('th',t(key)));$('slotsHead').replaceChildren(head);
 const rows=[];for(let tier=1;tier<=4;tier++){const row=document.createElement('tr');row.append(cell('th',['ω','ε','Γ','Ω'][tier-1]),cell('td',RULES.gearSlots[tier]),cell('td',RULES.bookSlots[tier]),cell('td',(RULES.nativeArmorByTier||[16,18,20,22])[tier-1]),cell('td',(RULES.nativeToughnessByTier||[4,8,12,16])[tier-1]));rows.push(row);}$('slotsBody').replaceChildren(...rows);
}
function render(){
 document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=b('果糕逻辑 · '+t('title'),'Guogaology · '+t('title'));
 for(const e of document.querySelectorAll('[data-i18n]'))e.textContent=t(e.dataset.i18n);
 $('language').textContent=lang==='zh'?'English':'中文';$('mode').textContent=t(proposal?'modeProposal':preview?'modePreview':'modeCurrent');$('notice').textContent=t(proposal?'noticeProposal':preview?'noticePreview':'noticeCurrent');$('realm').value=realm;
 for(const e of document.querySelectorAll('input[name="level"]'))e.checked=levels.has(Number(e.value));
 const options=[new Option(t('all'),'-1')];for(let type=0;type<9;type++)options.push(new Option(coreName(type),String(type)));$('coreFilter').replaceChildren(...options);$('coreFilter').value=String(coreFilter);
 renderOverview();renderDetails();renderFormulas();$('footer').textContent=t('footer')+' · Rules '+BUILD.revision;persist();
}
for(const e of document.querySelectorAll('input[name="level"]'))e.onchange=()=>{const l=Number(e.value);if(e.checked)levels.add(l);else levels.delete(l);render();};
$('realm').onchange=()=>{realm=$('realm').value;render();};$('coreFilter').onchange=()=>{coreFilter=Number($('coreFilter').value);render();};$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';render();};$('reset').onclick=()=>{levels=new Set([0,1,2,3]);realm='normal';coreFilter=-1;render();};$('filters').onsubmit=e=>e.preventDefault();
render();
