    </div>
  </div>
  <p id="message" class="message" role="status"></p><footer class="bottom"><span data-i18n="footer"></span> <span id="testStatus"></span></footer>
</div>

function metric(label,value,unit=''){const d=document.createElement('div');d.className='metric';d.append(safeText(document.createElement('span'),label),safeText(document.createElement('strong'),value),safeText(document.createElement('small'),unit));return d;}
function details(node,pairs){node.replaceChildren();for(const [key,value] of pairs)node.append(safeText(document.createElement('dt'),t(key)),safeText(document.createElement('dd'),value));}
function chart(f){const w=560,h=150,left=38,right=18,top=12,bottom=25,maxT=Math.max(f.seconds,.5),maxHP=Math.max(1,f.maxHealth);const x=v=>left+(w-left-right)*v/maxT,y=v=>h-bottom-(h-top-bottom)*v/maxHP;const points=f.history.map(p=>x(p.seconds).toFixed(2)+','+y(p.health).toFixed(2)).join(' ');$('voidChart').innerHTML='<title>'+t('voidTitle')+'</title><desc>'+t(f.reached?'survived':'died')+'</desc><path class="axis" d="M'+left+' '+top+' V'+(h-bottom)+' H'+(w-right)+'"/><polygon class="area" points="'+left+','+(h-bottom)+' '+points+' '+x(f.seconds)+','+(h-bottom)+'"/><polyline class="curve" points="'+points+'"/><text x="'+(left-7)+'" y="'+(top+4)+'" text-anchor="end">'+fmt(maxHP)+'</text><text x="'+(left-7)+'" y="'+(h-bottom)+'" text-anchor="end">0</text><text x="'+left+'" y="'+(h-4)+'">0s</text><text x="'+(w-right)+'" y="'+(h-4)+'" text-anchor="end">'+fmt(f.seconds)+'s</text>';}
function renderResults(){
  const s=activeSnapshot(),e=E.calculate(s),m=E.misc(s),p=state.combat;
  $('scope').textContent=t(state.mode==='single'?'single':'set')+' · '+t(s.deep?'deep':'normal');$('metrics').replaceChildren(metric(t('attack'),fmt(e.attack),t('hp')),metric(t('speed'),fmt(e.miningMultiplier),'×'),metric(t('range'),fmt(e.extraBlocks),t('blocks')),metric(t('yield'),fmt(e.yieldLevel)),metric(t('reach'),'+'+fmt(e.reach),t('blocks')),metric(t('maxHealth'),fmt(m.maxHealth),t('hp')));
  const immunity=['poison','hunger','nausea','weakness','slowness',...(m.immuneLevel>=3?['wither','blindness','darkness']:[])];const flight=m.flight==='creative'?(s.deep?'10.89 / 87.12 / 7.50 / 60':'10.89 / 21.78 / 7.50 / 7.50'):m.flight==='slow'?'3.6 / 3.6 / 2.5 / 2.5':'—';
  details($('misc'),[['miningFinal',s.mainhand.kind===0&&(s.mainhand.tier>=0||(s.mainhand.vanilla&&s.mainhand.vanilla!=='hand'))?fmt(E.baseMining(s.mainhand)*e.miningMultiplier):'—'],['blockReach',fmt(e.actualBlockReach)+' '+t('blocks')],['entityReach',fmt(e.actualEntityReach)+' '+t('blocks')],['healthBonus','+'+fmt(e.bonusHealth)+' HP'],['wear',fmt(e.wearFactor)+'×'],['wearChance',fmt(100/e.wearFactor)+'%'],['armorWear',m.armorWear.map(fmt).join(' / ')],['regen',fmt(e.regeneration)+' HP'],['defense',fmt(e.protectionFactor)+'×'],['defenseReduction',fmt((1-1/e.protectionFactor)*100)+'%'],['oxygen',m.oxygenConsumption===0?t('infinite'):fmt(1/m.oxygenConsumption)+'×'],['jump','+'+fmt(m.jumpExtra)+' '+t('blocks')],['flight',t(m.flight==='none'?'none':m.flight)],['flightSpeeds',flight+' '+(state.lang==='zh'?'格/s':'blocks/s')],['fall',fmt(m.fallFactor)+'×'],['wall',fmt(m.wallFactor)+'×'],['night',t(m.nightVision?'yes':'none')],['fire',t(m.fireResistance?'yes':'none')],['autoTotem',t(m.autoTotem?'yes':'none')],['immune',m.immuneLevel>=2?immunity.map(t).join(' / '):t('none')]]);$('formula').textContent=t(s.deep?'formulaDeep':'formulaNormal');
  const out=E.combat(e,p),incoming=E.damage(p.incoming,p.source,{armor:p.ownArmor,toughness:p.ownToughness,resistance:p.ownResistance,epf:p.ownEpf,factor:e.protectionFactor,absorption:p.ownAbsorption,...m});
  $('damageMetrics').replaceChildren(metric(t('outgoing'),fmt(out.totalHealthDamage),'HP'),metric(t('received'),fmt(incoming.healthDamage),'HP'));
  details($('damageDetails'),[['directRaw',fmt(out.directRaw)+' HP'],['burstRaw',fmt(out.burstRaw)+' HP'],['directFinal',fmt(out.direct.beforeAbsorption)+' HP'],['burstFinal',fmt(out.burst.beforeAbsorption)+' HP'],['absorbed',fmt(out.absorbed)+' HP'],['projectileBurst',fmt(E.projectileBurst(p.projectileDamage,s.offhand.cores,s.deep))+' HP'],['control',fmt(e.controlSeconds)+' '+t('seconds')]]);
  const stages={raw:'raw',ability:'ability',armor:'armorStage',vanilla:'vanillaStage',cores:'coresStage',health:'healthStage'};const bars=$('damageBars');bars.replaceChildren();for(const a of incoming.stages){const row=document.createElement('div');row.className='barrow';const name=document.createElement('span');name.textContent=t(stages[a.stage]);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=(Math.max(0,Math.min(100,100*a.value/Math.max(p.incoming,1e-10))))+'%';track.append(fill);const value=document.createElement('span');value.className='value';value.textContent=fmt(a.value);row.append(name,track,value);bars.append(row);}
  if(p.endY>=p.startY){$('voidOutcome').textContent=t('invalidFall');$('voidOutcome').className='outcome failure';$('voidDetails').textContent='';$('voidChart').replaceChildren();return;}
  const f=E.voidForecast(s,p);$('voidOutcome').textContent=t(f.reached?'survived':'died');$('voidOutcome').className='outcome '+(f.reached?'success':'failure');$('voidDetails').textContent=t('voidResult',{t:fmt(f.seconds),y:fmt(f.y),h:fmt(f.health),n:f.hits});chart(f);
}
function render(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';document.title=t('title');for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=t(el.dataset.i18n);$('language').textContent=state.lang==='zh'?'English':'中文';$('coreReference').href='core-effects-reference.html?lang='+state.lang+'&realm='+(state.snapshot.deep?'deep':'normal');$('revision').textContent='Rules '+RULES.revision;$('testStatus').textContent=t('test',{n:BUILD.caseCount});$('mode').value=state.mode;$('realm').value=state.snapshot.deep?'deep':'normal';for(const el of document.querySelectorAll('[data-combat]')){const v=state.combat[el.dataset.combat];if(el.type==='checkbox')el.checked=v;else el.value=v;}$('source').replaceChildren(...Object.keys(E.SOURCES).map(v=>option(v,t('source_'+v))));$('source').value=state.combat.source;renderEditor();renderResults();persist();}
function selectGear(value){const key=state.selected,old=state.snapshot[key];let g=E.empty(old.kind);if(value==='hand')g={...E.empty(0),vanilla:'hand',baseAttack:1,baseMining:1};else if(value.startsWith('vanilla:')){const [,kind,metal]=value.split(':');const b={iron:[4,6,6],diamond:[5,7,8],netherite:[6,8,9],custom:[4,6,6]}[metal];g={...E.empty(Number(kind)),vanilla:metal,baseAttack:b[Number(kind)],baseMining:b[2]};}else if(value!=='empty'){const [tier,kind]=value.split(':').map(Number);g={tier,kind,digit:old.digit||0,cores:old.cores.filter(c=>compatible(kind,c.type))};}state.snapshot[key]=g;const n=normalize(state);state=n.state;render();if(n.trimmed)notice('trimmed');}
function preset(name){const deep=state.snapshot.deep,lang=state.lang;state=defaultState();state.lang=lang;state.snapshot.deep=deep;for(const [i,key] of slots.entries())state.snapshot[key]={tier:4,kind:[0,6,2,3,4,5][i],digit:0,cores:[]};const s=state.snapshot;
  if(name==='defense'){for(const key of ['helmet','chestplate','leggings','boots'])s[key].cores=[...Array.from({length:7},()=>c(6,3)),c(8,4)];s.offhand.cores=[c(7,3),c(7,3),c(4,3),c(6,3),c(8,4),c(8,4)];}
  if(name==='mining'){s.mainhand.cores=[c(0,3),c(0,3),c(0,3),c(2,3),c(2,3),c(2,3),c(4,3),c(8,4)];s.offhand.cores=[c(2,3),c(2,3),c(2,3),c(2,3),c(8,4),c(8,4)];}
  if(name==='combat'){s.mainhand.kind=1;s.mainhand.cores=[c(1,3),c(1,3),c(1,3),c(5,3),c(5,3),c(7,3),c(4,3),c(8,4)];s.offhand.cores=[c(1,3),c(7,3),c(4,3),c(6,3),c(8,4),c(8,4)];for(const key of ['helmet','chestplate','leggings','boots'])s[key].cores=[c(6,3),c(6,3),c(4,3),c(8,4)];}
  state=normalize(state).state;render();notice('saved');}
for(let i=0;i<=9;i++)$('digit').append(option(i,i));$('language').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';render();};$('mode').onchange=()=>{state.mode=$('mode').value;render();};$('realm').onchange=()=>{state.snapshot.deep=$('realm').value==='deep';render();};$('gearChoice').onchange=()=>selectGear($('gearChoice').value);$('digit').onchange=()=>{state.snapshot[state.selected].digit=Number($('digit').value);render();};for(const key of ['baseAttack','baseMining'])$(key).oninput=()=>{state.snapshot[state.selected][key]=Math.max(0,Number($(key).value)||0);renderResults();persist();};
for(const el of document.querySelectorAll('[data-combat]'))el.oninput=()=>{state.combat[el.dataset.combat]=el.type==='checkbox'?el.checked:Number(el.value)||0;renderResults();persist();};$('source').onchange=()=>{state.combat.source=$('source').value;renderResults();persist();};
for(const btn of document.querySelectorAll('[data-preset]'))btn.onclick=()=>preset(btn.dataset.preset);$('reset').onclick=()=>{const lang=state.lang;state=defaultState();state.lang=lang;render();notice('saved');};$('copyDefense').onclick=()=>{const e=E.calculate(activeSnapshot()),p=state.combat;p.targetFactor=e.protectionFactor;p.targetArmor=p.ownArmor;p.targetToughness=p.ownToughness;p.targetResistance=p.ownResistance;p.targetEpf=p.ownEpf;p.targetBurstEpf=p.ownEpf;p.targetAbsorption=p.ownAbsorption;render();};
function showJson(){ $('jsonText').value=JSON.stringify(state,null,2);$('jsonError').textContent=t('shareNote');$('jsonDialog').showModal(); }
$('json').onclick=showJson;$('closeDialog').onclick=()=>$('jsonDialog').close();$('importJson').onclick=()=>{try{const n=normalize(JSON.parse($('jsonText').value));state=n.state;$('jsonDialog').close();render();notice(n.trimmed?'trimmed':'saved');}catch(error){$('jsonError').textContent=t('invalidJson')+error.message;}};$('downloadJson').onclick=()=>{const a=document.createElement('a');const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='guogaology-equipment.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('share').onclick=async()=>{persist();try{await navigator.clipboard.writeText(location.href);notice('shared');}catch(_){showJson();notice('shareFallback');}};
try{const raw=location.hash.startsWith('#config=')?decode(location.hash.slice(8)):JSON.parse(localStorage.getItem('guogaology-simulator-v1')||'null');if(raw)state=normalize(raw).state;}catch(_){}
window.addEventListener('hashchange',()=>{try{state=normalize(decode(location.hash.slice(8))).state;render();}catch(_){}});
// Expose read-only calculator for offline verification, never a network endpoint.
window.GuogaologySimulator={engine:E,rules:RULES,build:BUILD,getState:()=>JSON.parse(JSON.stringify(state)),normalize};
render();
})();
</script>
