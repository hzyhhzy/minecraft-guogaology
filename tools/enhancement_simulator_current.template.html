      <section class="panel"><h2 data-i18n="combatInputs"></h2>

    </div>
  </div>
  <p id="message" class="message" role="status"></p><footer class="bottom"><span data-i18n="footer"></span> <span id="testStatus"></span></footer>
</div>

function render(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';document.title=t('title');for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=t(el.dataset.i18n);$('language').textContent=state.lang==='zh'?'English':'中文';$('coreReference').href='core-effects-reference.html?lang='+state.lang+'&realm='+(state.snapshot.deep?'deep':'normal');$('revision').textContent='Rules '+RULES.revision;$('testStatus').textContent=t('test',{n:BUILD.caseCount});$('mode').value=state.mode;$('realm').value=state.snapshot.deep?'deep':'normal';for(const el of document.querySelectorAll('[data-combat]')){const v=state.combat[el.dataset.combat];if(el.type==='checkbox')el.checked=v;else el.value=v;}$('source').replaceChildren(...Object.keys(E.SOURCES).map(v=>option(v,t('source_'+v))));$('source').value=state.combat.source;renderEditor();renderResults();persist();}
function selectGear(value){const key=state.selected,old=state.snapshot[key];let g=E.empty(old.kind);if(value==='hand')g={...E.empty(0),vanilla:'hand',baseAttack:1,baseMining:1};else if(value.startsWith('vanilla:')){const [,kind,metal]=value.split(':');const b={iron:[4,6,6],diamond:[5,7,8],netherite:[6,8,9],custom:[4,6,6]}[metal];g={...E.empty(Number(kind)),vanilla:metal,baseAttack:b[Number(kind)],baseMining:b[2]};}else if(value!=='empty'){const [tier,kind]=value.split(':').map(Number);g={tier,kind,digit:old.digit||0,silkTouch:!!old.silkTouch,cores:old.cores.filter(c=>compatible(kind,c.type))};}state.snapshot[key]=g;const n=normalize(state);state=n.state;render();if(n.trimmed)notice('trimmed');}
function preset(name){const deep=state.snapshot.deep,lang=state.lang;state=defaultState();state.lang=lang;state.snapshot.deep=deep;for(const [i,key] of slots.entries())state.snapshot[key]={tier:4,kind:[0,6,2,3,4,5][i],digit:0,cores:[]};const s=state.snapshot;
  if(name==='defense'){for(const key of ['helmet','chestplate','leggings','boots'])s[key].cores=Array.from({length:8},()=>c(6,3));s.offhand.cores=[c(7,3),c(7,3),c(4,3),c(6,3),c(8,4),c(8,4)];}
  if(name==='mining'){s.mainhand.cores=[c(0,3),c(0,3),c(0,3),c(0,3),c(2,3),c(3,3),c(0,3),c(0,3)];s.offhand.cores=[c(0,3),c(2,3),c(4,3),c(6,3),c(8,4),c(8,4)];s.helmet.cores=[c(4,3)];s.boots.cores=[c(4,3)];}
  if(name==='combat'){s.mainhand.kind=1;s.mainhand.cores=[c(1,3),c(1,3),c(1,3),c(5,3),c(5,3),c(7,3),c(3,3),c(1,3)];s.offhand.cores=[c(1,3),c(7,3),c(4,3),c(6,3),c(8,4),c(8,4)];for(const key of ['helmet','chestplate','leggings','boots'])s[key].cores=[c(6,3),c(6,3),c(3,3),c(6,3)];}
  if(name==='ranged'){s.mainhand.kind=7;s.mainhand.cores=[c(1,3),c(1,3),c(2,3),c(3,3),c(5,3),c(7,3)];s.offhand.cores=[c(1,3),c(6,3),c(7,3),c(4,3),c(8,4),c(8,4)];}
  state=normalize(state).state;render();notice('saved');}
for(let i=0;i<=9;i++)$('digit').append(option(i,i));$('language').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';render();};$('mode').onchange=()=>{state.mode=$('mode').value;render();};$('realm').onchange=()=>{state.snapshot.deep=$('realm').value==='deep';render();};$('gearChoice').onchange=()=>selectGear($('gearChoice').value);$('digit').onchange=()=>{state.snapshot[state.selected].digit=Number($('digit').value);render();};for(const key of ['baseAttack','baseMining'])$(key).oninput=()=>{state.snapshot[state.selected][key]=Math.max(0,Number($(key).value)||0);renderResults();persist();};
$('silkTouch').onchange=()=>{state.snapshot[state.selected].silkTouch=$('silkTouch').checked;renderResults();persist();};
for(const key of ['nativeEfficiency','nativeYield'])$(key).oninput=()=>{const g=state.snapshot[state.selected];g[key]=Math.max(0,Math.min(key==='nativeEfficiency'?5:3,Math.trunc(Number($(key).value)||0)));renderResults();persist();};
for(const el of document.querySelectorAll('[data-mining]'))el.onchange=()=>{state.snapshot[el.dataset.mining]=el.checked;renderResults();persist();};
for(const el of document.querySelectorAll('[data-combat]'))el.oninput=()=>{state.combat[el.dataset.combat]=el.type==='checkbox'?el.checked:Number(el.value)||0;renderResults();persist();};$('source').onchange=()=>{state.combat.source=$('source').value;renderResults();persist();};
for(const btn of document.querySelectorAll('[data-preset]'))btn.onclick=()=>preset(btn.dataset.preset);$('reset').onclick=()=>{const lang=state.lang;state=defaultState();state.lang=lang;render();notice('saved');};$('copyDefense').onclick=()=>{const e=E.calculate(activeSnapshot()),p=state.combat;p.targetFactor=e.protectionFactor;p.targetArmor=p.ownArmor+(e.nativeArmor||0);p.targetToughness=p.ownToughness+(e.nativeToughness||0);p.targetResistance=p.ownResistance;p.targetEpf=p.ownEpf;p.targetBurstEpf=p.ownEpf;p.targetAbsorption=p.ownAbsorption;render();};
function showJson(){ $('jsonText').value=JSON.stringify(state,null,2);$('jsonError').textContent=t('shareNote');$('jsonDialog').showModal(); }
$('json').onclick=showJson;$('closeDialog').onclick=()=>$('jsonDialog').close();$('importJson').onclick=()=>{try{const n=normalize(JSON.parse($('jsonText').value));state=n.state;$('jsonDialog').close();render();notice(n.removedOrdinal?'ordinalRemoved':n.trimmed?'trimmed':'saved');}catch(error){$('jsonError').textContent=t('invalidJson')+error.message;}};$('downloadJson').onclick=()=>{const a=document.createElement('a');const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='guogaology-equipment.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('share').onclick=async()=>{persist();try{await navigator.clipboard.writeText(location.href);notice('shared');}catch(_){showJson();notice('shareFallback');}};
let initialNotice='';try{const raw=location.hash.startsWith('#config=')?decode(location.hash.slice(8)):JSON.parse(localStorage.getItem('guogaology-simulator-v1')||'null');if(raw){const n=normalize(raw);state=n.state;initialNotice=n.removedOrdinal?'ordinalRemoved':n.trimmed?'trimmed':'';}}catch(_){}
window.addEventListener('hashchange',()=>{try{const n=normalize(decode(location.hash.slice(8)));state=n.state;render();if(n.removedOrdinal||n.trimmed)notice(n.removedOrdinal?'ordinalRemoved':'trimmed');}catch(_){}});
// Expose read-only calculator for offline verification, never a network endpoint.
window.GuogaologySimulator={engine:E,rules:RULES,build:BUILD,getState:()=>JSON.parse(JSON.stringify(state)),normalize};
render();if(initialNotice)notice(initialNotice);
})();
</script>
